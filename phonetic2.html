<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Phonetic + Voice Styles</title>

  <!-- ✅ AdSense loader (ONLY ONCE) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXX"
    crossorigin="anonymous"></script>

  <style>
    :root{
      --bg:#0b0f14; --p:#111826; --p2:#0f1623; --t:#e8eef7; --m:#a8b3c7;
      --b:rgba(255,255,255,.14); --field:rgba(255,255,255,.06);
    }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--t)}
    .page{
      max-width:1280px;
      margin:0 auto;
      padding:16px;
      display:grid;
      grid-template-columns: 240px 1fr;
      gap:16px;
      align-items:start;
    }
    @media (max-width: 980px){
      .page{grid-template-columns:1fr}
      .sideAd{order:-1} /* show side ad on top on small screens */
    }

    .card{background:linear-gradient(180deg,var(--p),var(--p2));border:1px solid var(--b);border-radius:16px;overflow:hidden}
    .h{padding:12px 14px;border-bottom:1px solid var(--b);display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
    .h h1{margin:0;font-size:16px}
    .h small{color:var(--m)}
    .bd{padding:14px}
    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:10px 0}
    label{color:var(--m);font-size:12px}

    textarea{
      width:100%;min-height:110px;resize:vertical;border:1px solid var(--b);
      background:var(--field);color:var(--t);border-radius:12px;padding:10px;font-size:14px;outline:none
    }
    select,input[type="range"]{
      border:1px solid var(--b);background:var(--field);color:var(--t);
      border-radius:12px;padding:10px;font-size:14px;outline:none;width:100%
    }
    select{
      appearance:none;-webkit-appearance:none;-moz-appearance:none;background-color:var(--field);
      background-image:
        linear-gradient(45deg, transparent 50%, var(--m) 50%),
        linear-gradient(135deg, var(--m) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) calc(50% - 2px),
        calc(100% - 12px) calc(50% - 2px);
      background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:34px
    }
    option{background:#0f1623;color:#e8eef7}

    button{
      border:1px solid var(--b);background:rgba(255,255,255,.08);color:var(--t);
      border-radius:12px;padding:10px 12px;font-weight:700;cursor:pointer
    }
    button:hover{border-color:rgba(110,231,255,.35)}
    .k{display:flex;gap:10px;flex-wrap:wrap}
    .pill{
      display:flex;gap:8px;align-items:center;border:1px solid var(--b);
      background:rgba(255,255,255,.05);border-radius:999px;padding:8px 10px;color:var(--m);font-size:12px
    }
    .out{
      border:1px solid var(--b);background:rgba(255,255,255,.05);border-radius:12px;padding:12px;
      min-height:110px;white-space:pre-wrap;word-break:break-word;
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      font-size:13px;line-height:1.5
    }

    .selectRow{
      display:grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap:14px;
      align-items:end;
      margin:10px 0 12px;
    }
    @media (max-width:720px){ .selectRow{grid-template-columns:1fr;} }
    .ctrl{display:flex;flex-direction:column;gap:6px}

    details.dropdown{
      border:1px solid var(--b);
      border-radius:12px;
      background:rgba(255,255,255,.04);
      padding:10px 12px;
      margin:10px 0 12px;
    }
    details.dropdown > summary{
      cursor:pointer; user-select:none; list-style:none;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      color:var(--t); font-weight:700;
    }
    details.dropdown > summary::-webkit-details-marker{display:none}
    details.dropdown > summary .hint{font-weight:600;color:var(--m);font-size:12px}
    details.dropdown[open] > summary{margin-bottom:10px}
    .sliderCol{display:grid;grid-template-columns:1fr;gap:14px}
    input[type="range"]{height:44px;padding:10px}

    /* Ad boxes */
    .ad{
      border:1px dashed rgba(255,255,255,.25);
      border-radius:16px;
      background:rgba(255,255,255,.03);
      padding:12px;
      text-align:center;
      color:var(--m)
    }
    .sideAd{
      position:sticky;
      top:16px;
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- ✅ LEFT SIDE AD (replaces the two lower ads) -->
    <div class="ad sideAd">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXX"
           data-ad-slot="4444444444"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>

    <!-- MAIN CONTENT -->
    <div>
      <div class="card">
        <div class="h">
          <div>
            <h1>NATO Phonetic Encoder + Voice Styles</h1>
            <small>Type → Convert → Copy → Speak</small>
          </div>
          <div class="k">
            <button id="convert">Convert</button>
            <button id="copy">Copy</button>
            <button id="speak">Speak</button>
            <button id="stop">Stop</button>
          </div>
        </div>

        <div class="bd">
          <textarea id="inp" placeholder="Type your message…"></textarea>

          <div class="row">
            <span class="pill">
              <input id="showChars" type="checkbox" />
              <label for="showChars">Show A:Alpha</label>
            </span>
            <span class="pill">
              <input id="auto" type="checkbox" checked />
              <label for="auto">Auto-convert</label>
            </span>
            <span class="pill">
              <input id="compact" type="checkbox" />
              <label for="compact">Compact</label>
            </span>
          </div>

          <div class="selectRow">
            <div class="ctrl">
              <label for="style">Style</label>
              <select id="style">
                <option value="clean" selected>Clean</option>
                <option value="distort">Distorted / Corrupt</option>
                <option value="radio">Radio / Comms</option>
                <option value="robot">Robot / Spell-Out</option>
                <option value="stutter">Stutter / Broken</option>
                <option value="reverse">Reverse Letters</option>
                <option value="cutup">Cut-Up Syllables</option>
              </select>
            </div>

            <div class="ctrl">
              <label for="voice">Voice</label>
              <select id="voice"></select>
            </div>
          </div>

          <details class="dropdown" id="sliderDropdown">
            <summary>
              Voice sliders
              <span class="hint">(click to open/close)</span>
            </summary>

            <div class="sliderCol">
              <div class="ctrl">
                <label for="srate">Speaking rate (overall)</label>
                <input id="srate" type="range" min="0.6" max="1.6" step="0.05" value="1.0" />
              </div>

              <div class="ctrl">
                <label for="rate">Base rate (style start)</label>
                <input id="rate" type="range" min="0.6" max="1.6" step="0.05" value="1.0" />
              </div>

              <div class="ctrl">
                <label for="pitch">Pitch</label>
                <input id="pitch" type="range" min="0.2" max="2.0" step="0.05" value="1.0" />
              </div>

              <div class="ctrl">
                <label for="int">Intensity</label>
                <input id="int" type="range" min="0" max="1" step="0.05" value="0.85" />
              </div>
            </div>
          </details>

          <div class="out" id="out"></div>
        </div>
      </div>

      <div style="height:12px"></div>

      <!-- ✅ ONE BOTTOM AD (keep only this one) -->
      <div class="ad">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXX"
             data-ad-slot="3333333333"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
          (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
      </div>
    </div>
  </div>

  <script>
    const NATO = {
      A:"Alpha",B:"Bravo",C:"Charlie",D:"Delta",E:"Echo",F:"Foxtrot",
      G:"Golf",H:"Hotel",I:"India",J:"Juliett",K:"Kilo",L:"Lima",
      M:"Mike",N:"November",O:"Oscar",P:"Papa",Q:"Quebec",R:"Romeo",
      S:"Sierra",T:"Tango",U:"Uniform",V:"Victor",W:"Whiskey",X:"X-ray",
      Y:"Yankee",Z:"Zulu",
      0:"Zero",1:"One",2:"Two",3:"Three",4:"Four",5:"Five",
      6:"Six",7:"Seven",8:"Eight",9:"Nine"
    };

    const $ = (id) => document.getElementById(id);

    const inp = $("inp");
    const out = $("out");
    const showChars = $("showChars");
    const auto = $("auto");
    const compact = $("compact");

    const voiceSel = $("voice");
    const styleSel = $("style");
    const speakRate = $("srate");
    const baseRate = $("rate");
    const pitch = $("pitch");
    const intensity = $("int");
    const sliderDropdown = $("sliderDropdown");

    const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
    const rand = (a,b)=>a + Math.random()*(b-a);

    function setDefaults(){
      styleSel.value = "clean";
      sliderDropdown.open = false;
    }

    sliderDropdown.addEventListener("click", (e) => {
      const summaryClicked = e.target.closest("summary");
      if(!summaryClicked) return;
      e.preventDefault();
      sliderDropdown.open = !sliderDropdown.open;
    });

    function toPhonetic(msg){
      const parts = [];
      for(const ch of msg){
        if(ch === " "){ parts.push("/"); continue; }
        const key = ch.toUpperCase();
        const word = NATO[key];
        parts.push(word ? (showChars.checked ? `${ch}:${word}` : word) : ch);
      }
      let t = parts.join(" ");
      if(!compact.checked) t = t.replaceAll(" / ", "  /  ");
      return t.trim();
    }

    function convert(){
      out.textContent = toPhonetic(inp.value || "");
    }

    function isWordLike(t){ return /^[a-z0-9\-\/:]+$/i.test(t); }

    function vowelShift(str){
      const map = [
        ["a","uh"],["e","ih"],["i","ee"],["o","aw"],["u","oo"],
        ["A","UH"],["E","IH"],["I","EE"],["O","AW"],["U","OO"]
      ];
      let s = str;
      for(const [k,v] of map){
        if(Math.random() < 0.35) s = s.replaceAll(k, v);
      }
      return s;
    }

    function dropLetters(str, amt){
      if(str.length <= 3) return str;
      const keep = [];
      for(let i=0;i<str.length;i++){
        const ch = str[i];
        const edge = (i===0 || i===str.length-1);
        if(edge){ keep.push(ch); continue; }
        const dropP = 0.08 + 0.35*amt;
        if(Math.random() < dropP) continue;
        keep.push(ch);
      }
      return keep.join("");
    }

    function chunkWord(str, amt){
      if(str.length <= 3) return [str];
      const chunks = [];
      const maxChunks = Math.round(2 + 3*amt);
      let i = 0;
      while(i < str.length){
        const remain = str.length - i;
        const maxSize = Math.min(3 + Math.round(3*amt), remain);
        const size = Math.max(1, Math.min(maxSize, Math.floor(rand(1, maxSize+1))));
        chunks.push(str.slice(i, i+size));
        i += size;
        if(chunks.length >= maxChunks && i < str.length){
          chunks.push(str.slice(i));
          break;
        }
      }
      return chunks;
    }

    function cutupSyllables(str, amt){
      const pieces = chunkWord(str, amt);
      if(pieces.length <= 1) return pieces;
      for(let i=0;i<pieces.length-1;i++){
        if(Math.random() < 0.55*amt){
          [pieces[i], pieces[i+1]] = [pieces[i+1], pieces[i]];
          i++;
        }
      }
      return pieces;
    }

    function stutterify(str, amt){
      const pieces = chunkWord(str, amt);
      const first = pieces[0];
      const reps = 1 + Math.round(2*amt);
      const out = [];
      for(let r=0;r<reps;r++) out.push(first);
      out.push(...pieces);
      return out;
    }

    function robotSpell(str, amt){
      const letters = str.split("");
      const out = [];
      for(const ch of letters){
        out.push(ch);
        if(Math.random() < 0.15*amt) out.push(ch);
      }
      return out;
    }

    function reverseLetters(str){
      return [str.split("").reverse().join("")];
    }

    function makePronunciation(token, style, amt){
      if(!isWordLike(token)) return [token];
      if(token === "/") return ["/"];

      let base = token, prefix = "";
      const c = token.indexOf(":");
      if(c !== -1){ prefix = token.slice(0,c+1); base = token.slice(c+1); }
      let w = base;

      if(style === "clean") return [token];

      if(style === "distort"){
        w = dropLetters(w, amt);
        w = vowelShift(w);
        const pieces = chunkWord(w, amt).map(p => (Math.random()<0.25*amt ? vowelShift(p) : p));
        if(Math.random() < 0.35*amt) pieces.splice(Math.floor(rand(0, pieces.length+1)), 0, "ksshh");
        if(prefix) pieces[0] = prefix + pieces[0];
        return pieces;
      }

      if(style === "radio"){
        w = dropLetters(w, 0.35*amt);
        const pieces = chunkWord(w, 0.65*amt);
        if(Math.random() < 0.30*amt) pieces.push("over");
        if(Math.random() < 0.20*amt) pieces.unshift("copy");
        if(prefix) pieces[0] = prefix + pieces[0];
        return pieces;
      }

      if(style === "robot"){
        const pieces = robotSpell(w, amt);
        if(prefix) pieces[0] = prefix + pieces[0];
        return pieces;
      }

      if(style === "stutter"){
        const pieces = stutterify(w, amt);
        if(prefix) pieces[0] = prefix + pieces[0];
        return pieces;
      }

      if(style === "reverse"){
        const pieces = reverseLetters(w);
        if(prefix) pieces[0] = prefix + pieces[0];
        return pieces;
      }

      if(style === "cutup"){
        const pieces = cutupSyllables(vowelShift(w), amt);
        if(prefix) pieces[0] = prefix + pieces[0];
        return pieces;
      }

      return [token];
    }

    let voices = [];

    function loadVoices(){
      voices = speechSynthesis.getVoices() || [];
      voiceSel.innerHTML = "";

      if(!voices.length){
        const o = document.createElement("option");
        o.textContent = "No voices yet";
        o.value = "";
        voiceSel.appendChild(o);
        return;
      }

      const sorted = [...voices].sort((a,b)=>{
        const ae = (a.lang||"").toLowerCase().startsWith("en");
        const be = (b.lang||"").toLowerCase().startsWith("en");
        if(ae !== be) return be - ae;
        return (a.name||"").localeCompare(b.name||"");
      });

      for(const v of sorted){
        const o = document.createElement("option");
        o.value = v.name;
        o.textContent = `${v.name} (${v.lang})`;
        voiceSel.appendChild(o);
      }

      const prefer = sorted.find(v => (v.lang||"").toLowerCase().startsWith("en")) || sorted[0];
      voiceSel.value = prefer?.name || "";
    }

    function getVoice(){
      const n = voiceSel.value;
      return voices.find(v => v.name === n) || null;
    }

    function speakStyled(text){
      speechSynthesis.cancel();

      const style = styleSel.value;
      const overall = parseFloat(speakRate.value);
      const baseR = parseFloat(baseRate.value);
      const baseP = parseFloat(pitch.value);
      const amt = parseFloat(intensity.value);
      const v = getVoice();

      const toks = text.split(/\s+/).filter(Boolean);
      const pron = [];
      for(const t of toks) pron.push(...makePronunciation(t, style, amt));

      let i = 0;

      function next(){
        if(i >= pron.length) return;
        const t = pron[i++];

        if(t === "/"){
          setTimeout(next, 90 + 450*amt);
          return;
        }

        const u = new SpeechSynthesisUtterance(t);
        u.voice = v || null;

        let r = baseR * overall;
        let p = baseP;

        if(style === "distort"){
          r += rand(-0.55, 0.45) * amt;
          p += rand(-1.10, 1.05) * amt;
          if(Math.random() < 0.35*amt){ r -= 0.25*amt; p -= 0.55*amt; }
        } else if(style === "radio"){
          r += rand(-0.25, 0.25) * amt;
          p += rand(-0.25, 0.25) * amt;
          r += 0.10; p -= 0.10;
        } else if(style === "robot"){
          r = (baseR + 0.10) * overall;
          p = baseP - 0.15;
        } else if(style === "stutter"){
          r += rand(-0.35, 0.25) * amt;
          p += rand(-0.65, 0.65) * amt;
        } else if(style === "reverse" || style === "cutup"){
          r += rand(-0.30, 0.30) * amt;
          p += rand(-0.55, 0.55) * amt;
        }

        u.rate = clamp(r, 0.55, 1.8);
        u.pitch = clamp(p, 0.1, 2.0);

        u.onend = () => {
          const pause = (style === "distort")
            ? (25 + rand(20,180) + 450*amt*Math.random())
            : (8 + rand(5,60) + 140*amt*Math.random());
          setTimeout(next, pause);
        };

        speechSynthesis.speak(u);
      }

      next();
    }

    $("convert").onclick = convert;

    $("copy").onclick = async () => {
      const t = out.textContent || "";
      if(!t) return;
      try{
        await navigator.clipboard.writeText(t);
      }catch{
        const ta = document.createElement("textarea");
        ta.value = t;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
    };

    $("speak").onclick = () => {
      const t = (out.textContent && out.textContent.trim())
        ? out.textContent
        : toPhonetic(inp.value || "");
      out.textContent = t;
      speakStyled(t);
    };

    $("stop").onclick = () => speechSynthesis.cancel();

    inp.addEventListener("input", ()=>{ if(auto.checked) convert(); });
    showChars.addEventListener("change", convert);
    compact.addEventListener("change", convert);

    setDefaults();
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
    convert();
  </script>
</body>
</html>
